<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaitPlay</title>
    <!-- ✅ 초기 로딩 스타일 (FOUC 방지 + 빠른 피드백) -->
    <style>
      body { margin: 0; background: #fdf2f8; }
      .initial-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 9999;
      }
      .initial-loader video {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 16px;
      }
      .initial-loader p {
        font-size: 16px;
        color: #86868b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
      }
    </style>
    <!-- ✅ 폰트 리소스 힌트 -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- ✅ API 프리커넥트 -->
    <link rel="preconnect" href="https://api.waitplay.co.kr">
    <!-- ✅ 폰트 로드 (display=swap으로 빠른 렌더링, 400만 우선 로드) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet"></noscript>
    <!-- 나머지 폰트 웨이트는 지연 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  </head>
  <body>
    <!-- ✅ 초기 로딩 화면 (Vue 앱 로드 전 표시) -->
    <div class="initial-loader" id="initial-loader">
      <video autoplay loop muted playsinline>
        <source src="/loading-character.mp4" type="video/mp4" />
      </video>
      <p>로딩 중...</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Vue 앱이 마운트되면 초기 로더 제거
      const observer = new MutationObserver(() => {
        if (document.getElementById('app')?.children.length > 0) {
          document.getElementById('initial-loader')?.remove();
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('app'), { childList: true });
    </script>
  </body>
</html>
