<!doctype html>
<html lang="ko" style="background:#fdf2f8">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf2f8" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>WaitPlay</title>
    <meta name="description" content="게임하고 혜택받자! WaitPlay에서 재미있는 게임을 즐기고 특별한 혜택을 받아보세요." />

    <!-- ✅ 초기 로딩 스타일 (인라인 - 즉시 적용) -->
    <style>
      html,body{margin:0;background:#fdf2f8}
      .initial-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;background:#fdf2f8}
      .initial-loader video{width:120px;height:120px;object-fit:contain;border-radius:16px}
      .initial-loader p{font-size:16px;color:#86868b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0}
    </style>
    <!-- ✅ API 프리커넥트 (필수) -->
    <link rel="preconnect" href="https://api.waitplay.co.kr">
  </head>
  <body>
    <!-- ✅ 초기 로딩 화면 (Vue 앱 로드 전 표시) -->
    <div class="initial-loader" id="initial-loader">
      <video autoplay loop muted playsinline>
        <source src="/loading-character.mp4" type="video/mp4" />
      </video>
      <p>로딩 중...</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Vue 앱이 마운트되면 초기 로더 제거
      const observer = new MutationObserver(() => {
        if (document.getElementById('app')?.children.length > 0) {
          document.getElementById('initial-loader')?.remove();
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('app'), { childList: true });
    </script>
  </body>
</html>
