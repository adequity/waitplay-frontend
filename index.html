<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaitPlay</title>
    <!-- ✅ 초기 로딩 스타일 (FOUC 방지 + 빠른 피드백) -->
    <style>
      body { margin: 0; background: #fdf2f8; }
      #app:empty::after {
        content: '';
        position: fixed;
        top: 50%; left: 50%;
        width: 32px; height: 32px;
        margin: -16px 0 0 -16px;
        border: 3px solid #f9a8d4;
        border-top-color: #ec4899;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <!-- ✅ 폰트 리소스 힌트 -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- ✅ API 프리커넥트 -->
    <link rel="preconnect" href="https://api.waitplay.co.kr">
    <!-- ✅ 폰트 로드 (display=swap으로 빠른 렌더링, 400만 우선 로드) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet"></noscript>
    <!-- 나머지 폰트 웨이트는 지연 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
